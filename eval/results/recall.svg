<svg xmlns="http://www.w3.org/2000/svg" width="680" height="320" viewBox="0 0 680 320">
  <rect width="680" height="320" fill="#0d1117" rx="8"/>
  <text x="24" y="34" fill="#f0f6fc" font-family="system-ui, sans-serif" font-size="16" font-weight="700">Recall@3 Comparison: KRONOS vs. Naive Single-Query Baseline</text>
  <text x="24" y="54" fill="#8b949e" font-family="system-ui, sans-serif" font-size="12">Measured on 50-item Legal Assertion Set &amp; 15-item Adversarial Subset</text>
  <!-- Overall -->
  <text x="40" y="105" fill="#c9d1d9" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Overall Set (n=50)</text>
  <rect x="200" y="85" width="392" height="24" fill="#238636" rx="4"/>
  <text x="602" y="102" fill="#3fb950" font-family="monospace" font-size="13" font-weight="700">KRONOS 98.0%</text>
  <rect x="200" y="116" width="240" height="24" fill="#30363d" rx="4"/>
  <text x="450" y="133" fill="#8b949e" font-family="monospace" font-size="13">Baseline 60.0%</text>
  <!-- Adversarial -->
  <text x="40" y="205" fill="#c9d1d9" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Adversarial (n=15)</text>
  <rect x="200" y="185" width="373" height="24" fill="#1f6feb" rx="4"/>
  <text x="583" y="202" fill="#58a6ff" font-family="monospace" font-size="13" font-weight="700">KRONOS 93.3% (+80 pts)</text>
  <rect x="200" y="216" width="53" height="24" fill="#30363d" rx="4"/>
  <text x="263" y="233" fill="#8b949e" font-family="monospace" font-size="13">Baseline 13.3%</text>
</svg>